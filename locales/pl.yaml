    pending_tool_result: "tura zatrzymała się, gdy wynik narzędzia wciąż oczekiwał, a model nie wygenerował dalszego tekstu. Wyślij `continue`, aby pozwolić mu podsumować."
    interrupted_during_api_call: "żądanie zostało przerwane w trakcie wywołania, zanim nadeszła odpowiedź. Wyślij `continue`, aby spróbować ponownie."
    max_iterations_reached: "osiągnięto maksymalny limit iteracji narzędzi przed ostateczną odpowiedzią. Wyślij `continue`, aby kontynuować, lub zwiększ `max_iterations`."
    error_near_max_iterations: "wystąpił błąd blisko limitu iteracji, przed ostateczną odpowiedzią. Sprawdź wynik narzędzia powyżej, a następnie wyślij `continue`."
    repeated_outer_errors: "tura wciąż kończyła się powtarzającymi się błędami i została zatrzymana wcześniej zamiast powtarzać się bez końca. Sprawdź błędy powyżej, a następnie wyślij `continue`, aby spróbować ponownie."
  persistence:
    compression: "tura została zatrzymana, ponieważ inny proces kompresował tę sesję. Twoja wiadomość powinna być już zapisana — wyślij ją ponownie po zakończeniu kompresji."
    compression_closed: "tura została zatrzymana, ponieważ ta sesja została zrotowana przez kompresję kontekstu, a jej bieżącej kontynuacji nie udało się przejąć. Sam magazyn jest sprawny — odśwież klienta (lub rozpocznij nową turę), aby pobrał nowe id sesji, a następnie wyślij wiadomość ponownie."
    turn_lease: "tura została zatrzymana, ponieważ inny proces Hermesa przejął tę sesję. Twoja odpowiedź nie została zapisana — poczekaj, aż drugi proces zakończy pracę, a następnie wyślij wiadomość ponownie."
    session_row_missing: "ta sesja została usunięta z magazynu, gdy czat był jeszcze otwarty, a Hermes nie mógł jej odtworzyć, więc ta wiadomość nie została zapisana. Wyślij wiadomość ponownie; jeśli błąd się powtarza, uruchom `hermes {profile_arg}doctor`."
    locked: "tura została zatrzymana, ponieważ magazyn sesji był zajęty (inny proces Hermesa zapisywał do bazy stanu). Twoja wiadomość powinna być już zapisana — wyślij ją ponownie za chwilę."
    replaced: "plik bazy danych sesji został podmieniony w trakcie działania Hermesa, więc ta wiadomość nie została zapisana (kopia jest przechowywana w {home}/sessions/). Zatrzymaj Hermesa (`hermes {profile_arg}gateway stop`), uruchom `hermes {profile_arg}doctor` — nie `hermes {profile_arg}doctor --fix`, które naprawiłoby niewłaściwy plik w miejscu — a następnie uruchom go ponownie i wyślij wiadomość jeszcze raz. Zaawansowane kroki odzyskiwania są w logu."
    deleted_wal: "inny proces Hermesa wciąż trzyma starą kopię dziennika write-ahead bazy danych sesji, więc Hermes przestał zapisywać, aby chronić plik, a ta wiadomość nie została zapisana (kopia jest przechowywana w {home}/sessions/). Nic nie przepadło. Zakończ każdy proces Hermesa na tym profilu (aplikacja Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron), uruchom `hermes {profile_arg}doctor` — wskaże każdy proces nadal trzymający dziennik — a następnie uruchom Hermesa ponownie i wyślij wiadomość jeszcze raz. Nie uruchamiaj `doctor --fix` ani nie usuwaj żadnych plików state.db, gdy te procesy działają. Przewodnik: {recovery_docs}"
    corrupt: "tura została zatrzymana, ponieważ baza stanu zgłosiła uszkodzenie strukturalne (transkrypt zostałby utracony po restarcie). Zwolnienie miejsca na dysku nie pomoże. Opcje odzyskiwania:\n1. Uruchom `hermes {profile_arg}doctor --fix`\n2. Zatrzymaj gateway, a następnie odzyskaj dane poleceniem:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (jeśli zgłosi, że dane są odzyskiwalne) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — odzyskiwanie najpierw tworzy migawkę uszkodzonego pliku; NIE uruchamiaj `sqlite3 ... \".recover\"` na działającym state.db, podatne CLI sqlite3 może uszkodzić go jeszcze bardziej\n3. Przywróć kopię zapasową z {backups_dir}/\nNastępnie wyślij wiadomość ponownie."
    fts_index: "tura została zatrzymana, ponieważ indeks wyszukiwania sesji (FTS5) jest uszkodzony i nie udało się go odłączyć, więc ta wiadomość nie została zapisana. Sam magazyn wiadomości nie jest uszkodzony: nie uruchamiaj narzędzi odzyskiwania ani nie przywracaj kopii zapasowej. Uruchom `hermes {profile_arg}doctor --fix` (lub zrestartuj Hermesa, który naprawia indeks przy otwarciu), a następnie wyślij wiadomość ponownie."
    disk: "Hermes nie mógł zapisać tej rozmowy na dysku, więc zatrzymał się, zamiast utracić Twoje wiadomości. Dysk jest prawdopodobnie pełny: zwolnij trochę miejsca (lub napraw uprawnienia do {home}/state.db), a następnie wyślij wiadomość ponownie."
    default: "Hermes nie mógł zapisać tej rozmowy, więc zatrzymał się, zamiast utracić Twoje wiadomości. Możliwe przyczyny: brak miejsca na dysku albo inny proces Hermesa blokuje bazę danych. Zamknij inne okna Hermesa, uruchom `hermes {profile_arg}doctor`, aby sprawdzić magazyn, a następnie wyślij wiadomość ponownie."
  file_mutation:
    header: "⚠️ Weryfikator zmian w plikach: liczba edycji plików, które NIE POWIODŁY SIĘ w tej turze: {count} — niezależnie od sformułowań powyżej, które mogą sugerować inaczej. Uruchom `git status` lub `read_file`, aby sprawdzić, co faktycznie zostało zapisane."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "niepowodzenie"
  shared:
    and_more: "  • … i jeszcze {count}"
    the_model: "Model"
tips:
  t001: "/bg <prompt> uruchamia zadanie w osobnej sesji, podczas gdy bieżąca pozostaje wolna; /btw <question> odpowiada na poboczne pytanie dotyczące tej rozmowy bez jej przerywania."
  t002: "/branch rozgałęzia bieżącą sesję, dzięki czemu możesz zbadać inny kierunek bez utraty postępów."
  t003: "/compress ręcznie kompresuje kontekst rozmowy, gdy staje się ona zbyt długa."
  t004: "/rollback wyświetla punkty kontrolne systemu plików — przywróć pliki zmodyfikowane przez agenta do dowolnego wcześniejszego stanu."
  t005: "/rollback diff 2 pokazuje, co zmieniło się od punktu kontrolnego 2, bez przywracania czegokolwiek."
  t006: "/rollback 2 src/file.py przywraca pojedynczy plik z konkretnego punktu kontrolnego."
  t007: "/title \"my project\" nadaje sesji nazwę — wznów ją później za pomocą /resume lub hermes -c."
  t008: "/resume kontynuuje od miejsca, w którym skończono w wcześniej nazwanej sesji."
  t009: "/queue <prompt> dodaje wiadomość do kolejki na następną turę bez przerywania bieżącej."
  t010: "/undo usuwa z rozmowy ostatnią wymianę użytkownik/asystent."
  t011: "/retry wysyła ponownie Twoją ostatnią wiadomość — przydatne, gdy odpowiedź agenta nie była do końca trafna."
  t012: "/verbose przełącza cyklicznie wyświetlanie postępu narzędzi: off → new → all → verbose."
  t013: "/reasoning high zwiększa głębokość myślenia modelu. /reasoning show wyświetla rozumowanie."
  t014: "/fast przełącza priorytetowe przetwarzanie dla szybszych odpowiedzi API (zależnie od dostawcy)."
  t015: "/yolo pomija wszystkie prośby o zatwierdzenie niebezpiecznych poleceń do końca sesji."
  t016: "/model pozwala zmienić model w trakcie sesji — wypróbuj /model sonnet lub /model gpt-5."
  t017: "/model --global trwale zmienia Twój domyślny model."
  t018: "/personality pirate ustawia zabawną osobowość — 14 wbudowanych opcji, od kawaii do shakespeare."
  t019: "/skin zmienia motyw CLI — wypróbuj ares, mono, slate, poseidon lub charizard."
  t020: "/statusbar przełącza stały pasek pokazujący model, tokeny, % wypełnienia kontekstu, koszt i czas trwania."
  t021: "/tools disable browser tymczasowo usuwa narzędzia przeglądarki na czas bieżącej sesji."
  t022: "/browser connect podłącza narzędzia przeglądarki do działającej przeglądarki z rodziny Chromium przez CDP."
  t023: "/plugins wyświetla zainstalowane wtyczki i ich status."
  t024: "/cron zarządza zaplanowanymi zadaniami — skonfiguruj cykliczne prompty z dostarczaniem na dowolną platformę."
  t025: "/reload-mcp przeładowuje konfigurację serwerów MCP na gorąco, bez restartu."
  t026: "/usage pokazuje zużycie tokenów, podział kosztów i czas trwania sesji."
  t027: "/insights pokazuje analitykę zużycia z ostatnich 30 dni."
  t028: "/paste sprawdza, czy w schowku jest obraz, i dołącza go do Twojej następnej wiadomości."
  t029: "/profile pokazuje, który profil jest aktywny, oraz jego katalog domowy."
  t030: "/config pokazuje w skrócie Twoją bieżącą konfigurację."
  t031: "/stop zabija wszystkie działające procesy w tle uruchomione przez agenta."
  t032: "@file:path/to/file.py wstawia zawartość pliku bezpośrednio do Twojej wiadomości."
  t033: "@file:main.py:10-50 wstawia tylko linie 10-50 pliku."
  t034: "@folder:src/ wstawia listing drzewa katalogu."
  t035: "@diff wstawia do wiadomości Twoje niezaindeksowane zmiany git."
  t036: "@staged wstawia Twoje zaindeksowane zmiany git (git diff --staged)."
  t037: "@git:5 wstawia 5 ostatnich commitów z pełnymi łatkami."
  t038: "@url:https://example.com pobiera i wstawia zawartość strony internetowej."
  t039: "Wpisanie @ uruchamia uzupełnianie ścieżek systemu plików — interaktywnie przejdź do dowolnego pliku."
  t040: "Łącz wiele odwołań: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter wstawia nową linię przy wpisywaniu wielowierszowym. (Windows Terminal przechwytuje Alt+Enter — użyj zamiast tego Ctrl+Enter.)"
  t042: "Ctrl+C przerywa działanie agenta. Naciśnij dwukrotnie w ciągu 2 sekund, aby wymusić wyjście."
  t043: "Ctrl+Z zawiesza Hermes w tle — uruchom fg w powłoce, aby wznowić."
  t044: "Tab akceptuje podpowiedź (szary tekst) lub autouzupełnia polecenia z ukośnikiem."
  t045: "Wpisz nową wiadomość, gdy agent pracuje, aby go przerwać i skierować w inną stronę."
  t046: "Alt+V wkleja obraz ze schowka do rozmowy."
  t047: "Wklejenie 5+ linii automatycznie zapisuje je do pliku i wstawia zamiast nich zwięzłe odwołanie."
  t048: "hermes -c wznawia Twoją najnowszą sesję CLI. hermes -c \"project name\" wznawia sesję według tytułu."
  t049: "hermes -w tworzy odizolowany worktree git — idealny do równoległych przepływów pracy agentów."
  t050: "hermes -w -q \"Fix issue #42\" łączy izolację w worktree z jednorazowym zapytaniem."
  t051: "hermes chat -t web,terminal włącza tylko wybrane zestawy narzędzi dla skupionej sesji."
  t052: "hermes chat -s github-pr-workflow wstępnie ładuje umiejętność przy uruchomieniu."
  t053: "hermes chat -q \"query\" wykonuje pojedyncze nieinteraktywne zapytanie i kończy działanie."
  t054: "hermes chat --max-turns 1000 nadpisuje domyślny limit 500 iteracji na turę."
  t055: "hermes chat --checkpoints włącza migawki systemu plików przed każdą destrukcyjną zmianą plików."
  t056: "hermes --yolo omija wszystkie prośby o zatwierdzenie niebezpiecznych poleceń przez całą sesję."
  t057: "hermes chat --source telegram oznacza sesję tagiem do filtrowania w hermes sessions list."
  t058: "hermes -p work chat działa pod wskazanym profilem bez zmiany Twojego domyślnego."
  t059: "hermes doctor --fix diagnozuje i automatycznie naprawia problemy z konfiguracją i zależnościami."
  t060: "hermes dump wypisuje zwięzłe podsumowanie konfiguracji — świetne do zgłoszeń błędów."
  t061: "hermes config set KEY VALUE automatycznie kieruje sekrety do .env, a wszystko inne do config.yaml."
  t062: "hermes config edit otwiera config.yaml w Twoim domyślnym edytorze."
  t063: "hermes config check skanuje konfigurację pod kątem brakujących lub przestarzałych opcji."
  t064: "hermes sessions browse otwiera interaktywną listę wyboru sesji z wyszukiwaniem."
  t065: "hermes sessions stats pokazuje liczbę sesji według platform oraz rozmiar bazy danych."
  t066: "hermes sessions prune --older-than 30 porządkuje stare sesje."
  t067: "hermes skills search react --source skills-sh przeszukuje publiczny katalog skills.sh."
  t068: "hermes skills check skanuje zainstalowane umiejętności z huba pod kątem aktualizacji upstream."
  t069: "hermes skills tap add myorg/skills-repo dodaje własne źródło umiejętności na GitHubie."
  t070: "hermes skills snapshot export setup.json eksportuje Twoją konfigurację umiejętności do kopii zapasowej lub udostępnienia."
  t071: "hermes mcp add github --command npx dodaje serwery MCP z wiersza poleceń."
  t072: "hermes mcp serve uruchamia samego Hermesa jako serwer MCP dla innych agentów."
  t073: "hermes auth add pozwala dodać wiele kluczy API do rotacji w puli danych uwierzytelniających."
  t074: "hermes completion bash >> ~/.bashrc włącza uzupełnianie tabulatorem dla wszystkich poleceń i profili."
  t075: "hermes logs -f śledzi agent.log w czasie rzeczywistym. --level WARNING --since 1h filtruje wynik."
  t076: "hermes backup tworzy kopię zapasową zip całego katalogu domowego Hermes."
  t077: "hermes profile create coder tworzy odizolowany profil, który staje się osobnym poleceniem."
  t078: "hermes profile create work --clone kopiuje Twoją bieżącą konfigurację i klucze do nowego profilu."
  t079: "hermes update automatycznie synchronizuje nowe dołączone umiejętności ze WSZYSTKIMI profilami."
  t080: "hermes gateway install konfiguruje Hermes jako usługę systemową (systemd/launchd)."
  t081: "hermes memory setup pozwala skonfigurować zewnętrznego dostawcę pamięci (Honcho, Mem0 itp.)."
  t082: "hermes webhook subscribe tworzy trasy webhooków sterowane zdarzeniami z walidacją HMAC."
  t083: "Oszczędzaj: hermes tools wyłącza nieużywane narzędzia, a hermes skills config ogranicza zestaw umiejętności."
  t084: "/reasoning low lub /reasoning minimal obniża głębokość myślenia poniżej domyślnej (medium) — szybsze i tańsze odpowiedzi."
  t085: "hermes models kieruje zadania wizji, kompresji i pomocnicze do tańszych modeli — obniża koszt tokenów w tle o 85%+ bez degradowania głównego modelu czatu."
  t086: "Ustaw display.bell_on_complete: true w config.yaml, aby usłyszeć dzwonek po zakończeniu długich zadań."
  t087: "Ustaw display.streaming: true, aby widzieć tokeny pojawiające się w czasie rzeczywistym podczas generowania."
  t088: "Ustaw display.show_reasoning: true, aby obserwować łańcuch rozumowania modelu."
  t089: "Ustaw display.compact: true, aby ograniczyć odstępy w wyniku i uzyskać gęstszy zapis informacji."
  t090: "Ustaw display.busy_input_mode: queue, aby kolejkować wiadomości zamiast przerywać agenta, lub steer, aby wstrzykiwać je w trakcie pracy przez /steer."
  t091: "Ustaw display.resume_display: minimal, aby pominąć pełne streszczenie rozmowy przy wznawianiu sesji."
  t092: "Ustaw compression.threshold: 0.50, aby kontrolować, kiedy uruchamia się automatyczna kompresja (domyślnie: 50% kontekstu)."
  t093: "Ustaw agent.max_turns: 1000, aby pozwolić agentowi wykonać więcej kroków z wywołaniami narzędzi na turę."
  t094: "Ustaw file_read_max_chars: 200000, aby zwiększyć maksymalną ilość treści na jedno wywołanie read_file."
  t095: "Ustaw approvals.mode: smart, aby LLM automatycznie zatwierdzał bezpieczne polecenia i odrzucał niebezpieczne."
  t096: "Ustaw fallback_model w config.yaml, aby automatycznie przełączać się na zapasowego dostawcę."
  t097: "Ustaw privacy.redact_pii: true, aby hashować identyfikatory użytkowników i numery telefonów przed wysłaniem do LLM."
  t098: "Ustaw browser.record_sessions: true, aby automatycznie nagrywać sesje przeglądarki jako wideo WebM."
  t099: "Ustaw worktree: true w config.yaml, aby zawsze tworzyć worktree git (to samo co hermes -w)."
  t100: "Ustaw security.website_blocklist.enabled: true, aby blokować wybrane domeny w narzędziach webowych."
  t101: "Ustaw cron.wrap_response: false, aby dostarczać surowy wynik agenta bez nagłówka/stopki crona."
  t102: "HERMES_TIMEZONE nadpisuje strefę czasową serwera dowolnym identyfikatorem strefy IANA."
  t103: "W config.yaml działa podstawianie zmiennych środowiskowych: użyj składni ${VAR_NAME}."
  t104: "Szybkie polecenia w config.yaml natychmiast uruchamiają polecenia powłoki bez zużycia tokenów."
  t105: "Własne osobowości można zdefiniować w config.yaml w sekcji agent.personalities."
  t106: "provider_routing steruje sortowaniem oraz białą i czarną listą dostawców OpenRouter."
  t107: "execute_code uruchamia skrypty Pythona wywołujące narzędzia Hermes programowo — wyniki nie trafiają do kontekstu."
  t108: "delegate_task uruchamia domyślnie do 10 równoległych podagentów (delegation.max_concurrent_children) z odizolowanymi kontekstami do pracy równoległej."
  t109: "web_extract działa z adresami URL plików PDF — podaj dowolny link do PDF, a zostanie skonwertowany do markdown."
  t110: "search_files opiera się na ripgrep i jest szybsze niż grep — używaj go zamiast grep w terminalu."
  t111: "patch używa 9 strategii dopasowania rozmytego, więc drobne różnice w białych znakach nie zepsują edycji."
  t112: "patch obsługuje format V4A do zbiorczej edycji wielu plików w jednym wywołaniu."
  t113: "read_file podpowiada podobne nazwy plików, gdy plik nie zostanie znaleziony."
  t114: "read_file automatycznie deduplikuje — ponowny odczyt niezmienionego pliku zwraca lekki skrót."
  t115: "browser_vision robi zrzut ekranu i analizuje go za pomocą AI — działa z CAPTCHA i treściami wizualnymi."
  t116: "browser_console może wykonywać wyrażenia JavaScript w kontekście strony."
  t117: "image_generate tworzy obrazy za pomocą FLUX 2 Pro z automatycznym powiększaniem 2x."
  t118: "text_to_speech zamienia tekst na dźwięk — na Telegramie odtwarzany jako wiadomości głosowe."
  t119: "send_message może dotrzeć do dowolnej podłączonej platformy komunikacyjnej z poziomu sesji."
  t120: "Narzędzie todo pomaga agentowi śledzić złożone, wieloetapowe zadania w trakcie sesji."
  t121: "session_search wykonuje wyszukiwanie pełnotekstowe we WSZYSTKICH wcześniejszych rozmowach."
  t122: "Agent automatycznie zapisuje w pamięci preferencje, poprawki i fakty o środowisku."
  t123: "/moa przepuszcza jeden trudny prompt przez skonfigurowany zestaw modeli Mixture of Agents."
  t124: "Polecenia terminala obsługują tryb w tle z notify_on_complete dla długotrwałych zadań."
  t125: "Procesy w tle w terminalu obsługują watch_patterns do alarmowania o określonych liniach wyjścia."
  t126: "Narzędzie terminal obsługuje 6 backendów: lokalny, Docker, SSH, Modal, Daytona i Singularity."
  t127: "Każdy profil ma własną konfigurację, klucze API, pamięć, sesje, umiejętności i zadania cron."
  t128: "Nazwy profili stają się poleceniami powłoki — 'hermes profile create coder' tworzy polecenie 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz tworzy przenośne archiwum profilu."
  t130: "Jeśli dwa profile przypadkowo współdzielą token bota, drugi gateway jest blokowany z czytelnym błędem."
  t131: "Sesje automatycznie otrzymują opisowe tytuły po pierwszej wymianie — bez ręcznego nazywania."
  t132: "Tytuły sesji obsługują ciągłość: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "Przy wyjściu Hermes wypisuje polecenie wznowienia z identyfikatorem sesji i statystykami."
  t134: "hermes sessions export backup.jsonl eksportuje wszystkie sesje do kopii zapasowej lub analizy."
  t135: "hermes -r SESSION_ID wznawia dowolną wcześniejszą sesję po jej identyfikatorze."
  t136: "Pamięć to zamrożona migawka — zmiany pojawiają się w prompcie systemowym dopiero przy starcie następnej sesji."
  t137: "Wpisy pamięci są automatycznie skanowane pod kątem wzorców prompt injection i eksfiltracji."
  t138: "Agent ma dwa magazyny pamięci: notatki osobiste (~2200 znaków) i profil użytkownika (~1375 znaków)."
  t139: "Poprawki, które przekazujesz agentowi (\"nie, zrób to tak\"), są często automatycznie zapisywane w pamięci."
  t140: "Ponad 80 dołączonych umiejętności obejmujących github, creative, mlops, productivity, research i inne."
  t141: "Każda zainstalowana umiejętność automatycznie staje się poleceniem z ukośnikiem — wpisz /, aby zobaczyć wszystkie."
  t142: "hermes skills install official/security/1password instaluje opcjonalne umiejętności z repozytorium."
  t143: "Umiejętności mogą być ograniczone do konkretnych systemów — niektóre ładują się tylko na macOS lub Linuxie."
  t144: "skills.external_dirs w config.yaml pozwala ładować umiejętności z własnych katalogów."
  t145: "Agent może tworzyć własne umiejętności jako pamięć proceduralną za pomocą skill_manage."
  t146: "/plan zapisuje plan implementacji w markdown do .hermes/plans/ bez wykonywania czegokolwiek."
  t147: "Zadania cron mogą dołączać umiejętności: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Cele dostarczania cron obejmują telegram, discord, slack, email, sms i ponad 12 innych platform."
  t149: "Jeśli odpowiedź crona zaczyna się od [SILENT], dostarczanie jest pomijane — przydatne w zadaniach wyłącznie monitorujących."
  t150: "Cron obsługuje opóźnienia względne (30m), interwały (every 2h), wyrażenia cron i znaczniki czasu ISO."
  t151: "Zadania cron działają w całkowicie nowych sesjach agenta — prompty muszą być samowystarczalne."
  t152: "Tryb głosowy działa bez żadnych kluczy API, jeśli zainstalowano faster-whisper (darmowe lokalne rozpoznawanie mowy)."
  t153: "Dostępnych jest pięciu dostawców TTS: Edge TTS (darmowy), ElevenLabs, OpenAI, NeuTTS (darmowy, lokalny), MiniMax."
  t154: "/voice on włącza tryb głosowy w CLI. Ctrl+B przełącza nagrywanie push-to-talk."
  t155: "Strumieniowe TTS odtwarza zdania w miarę ich generowania — nie czekasz na pełną odpowiedź."
  t156: "Wiadomości głosowe na Telegramie, Discordzie, WhatsAppie i Slacku są automatycznie transkrybowane."
  t157: "Hermes działa na 21 platformach komunikacyjnych: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail i inne."
  t158: "hermes gateway install konfiguruje go jako usługę systemową uruchamianą przy starcie systemu."
  t159: "DingTalk używa trybu Stream Mode — bez webhooków i publicznego adresu URL."
  t160: "BlueBubbles wprowadza iMessage do Hermes przez lokalny serwer na macOS."
  t161: "Trasy webhooków obsługują walidację HMAC, ograniczanie częstości żądań i filtrowanie zdarzeń."
  t162: "Serwer API udostępnia punkt końcowy zgodny z OpenAI, współpracujący z Open WebUI i LibreChat."
  t163: "Tryb kanału głosowego Discord: bot dołącza do VC, transkrybuje mowę i odpowiada głosem."
  t164: "group_sessions_per_user: true daje każdej osobie własną sesję w czatach grupowych."
  t165: "/sethome oznacza czat jako kanał domowy dla dostarczania zadań cron."
  t166: "Gateway obsługuje limity czasu oparte na braku aktywności — aktywni agenci mogą działać bez ograniczeń."
  t167: "Zatwierdzanie niebezpiecznych poleceń ma 4 poziomy: jednorazowo, na sesję, zawsze (trwała lista dozwolonych), odrzuć."
  t168: "Inteligentny tryb zatwierdzania używa LLM do automatycznego zatwierdzania bezpiecznych poleceń i oznaczania niebezpiecznych."
  t169: "Ochrona przed SSRF blokuje sieci prywatne, loopback, adresy link-local i adresy metadanych chmury."
  t170: "Skanowanie Tirith przed wykonaniem wykrywa podszywanie się homografami w URL i wzorce pipe-to-interpreter."
  t171: "Podprocesy MCP otrzymują przefiltrowane środowisko — przechodzą tylko bezpieczne zmienne systemowe."
  t172: "Pliki kontekstu (.hermes.md, AGENTS.md) są przed załadowaniem skanowane pod kątem prompt injection."
  t173: "command_allowlist w config.yaml trwale zatwierdza wybrane wzorce poleceń powłoki."
  t174: "Kontekst kompresuje się automatycznie po osiągnięciu progu — wspomnienia są zapisywane, a historia streszczana."
  t175: "Pasek stanu zmienia kolor na żółty, potem pomarańczowy, a następnie czerwony w miarę wypełniania kontekstu."
  t176: "SOUL.md to główny plik tożsamości agenta — dostosuj go, aby kształtować zachowanie."
  t177: "Hermes ładuje kontekst projektu z .hermes.md, AGENTS.md, CLAUDE.md lub .cursorrules (pierwszy znaleziony)."
  t178: "Pliki AGENTS.md w podkatalogach są odkrywane stopniowo, gdy agent wchodzi do kolejnych folderów."
  t179: "Pliki kontekstu są ograniczone do 20 000 znaków z inteligentnym przycinaniem początku/końca."
  t180: "Pięciu dostawców przeglądarki: lokalny Chromium, Browserbase, Browser Use, Camofox i Firecrawl."
  t181: "Camofox to przeglądarka antydetekcyjna — fork Firefoksa z fałszowaniem odcisku palca w C++."
  t182: "browser_navigate automatycznie zwraca migawkę strony — nie trzeba potem wywoływać browser_snapshot."
  t183: "browser_vision z annotate=true nakłada numerowane etykiety na elementy interaktywne."
  t184: "hermes mcp otwiera interaktywną listę wyboru zatwierdzonych przez Nous MCP, które instalujesz jednym klawiszem."
  t185: "hermes mcp catalog wyświetla zatwierdzone przez Nous serwery MCP dołączone do repozytorium."
  t186: "hermes mcp install <name> instaluje pozycję z katalogu, pyta o dane uwierzytelniające i pozwala wybrać, które z jej narzędzi włączyć."
  t187: "Serwery MCP konfiguruje się w config.yaml — obsługiwane są transporty stdio i HTTP."
  t188: "Filtrowanie narzędzi per serwer: tools.include tworzy białą listę, a tools.exclude czarną listę wybranych narzędzi."
  t189: "Serwery MCP automatycznie generują zestawy narzędzi w czasie działania — hermes tools może je przełączać per platforma."
  t190: "Obsługa OAuth w MCP: auth: oauth włącza autoryzację w przeglądarce z PKCE."
  t191: "Punkty kontrolne nie generują żadnego obciążenia, gdy pliki nie są modyfikowane — domyślnie włączone."
  t192: "Migawka sprzed przywracania jest zapisywana automatycznie, więc możesz cofnąć samo cofnięcie."
  t193: "/rollback cofa również turę rozmowy, więc agent nie pamięta wycofanych zmian."
  t194: "Punkty kontrolne używają repozytoriów-cieni w ~/.hermes/checkpoints/ — .git Twojego projektu nigdy nie jest dotykany."
  t195: "batch_runner.py przetwarza setki promptów równolegle na potrzeby generowania danych treningowych."
  t196: "hermes chat -Q włącza tryb cichy do użycia programowego — ukrywa baner i wskaźnik postępu."
  t197: "Zapisywanie trajektorii (--save-trajectories) rejestruje pełne ślady użycia narzędzi do trenowania modeli."
  t198: "Trzy typy wtyczek: ogólne (narzędzia/hooki), dostawcy pamięci i silniki kontekstu."
  t199: "hermes plugins install owner/repo instaluje wtyczki bezpośrednio z GitHuba."
  t200: "Zewnętrzni dostawcy pamięci: Honcho, OpenViking, Mem0 w pakiecie; Hindsight i inne przez hermes plugins install."
  t201: "Hooki wtyczek obejmują pre/post_tool_call, pre/post_llm_call oraz transform_terminal_output do kanonizacji wyjścia."
  t202: "Buforowanie promptów (Anthropic) obniża koszty, ponownie wykorzystując zbuforowane prefiksy promptu systemowego."
  t203: "Agent generuje tytuły sesji automatycznie w wątku w tle — bez wpływu na opóźnienia."
  t204: "Inteligentny routing modeli może automatycznie kierować proste zapytania do tańszego modelu."
  t205: "Polecenia z ukośnikiem obsługują dopasowanie prefiksów: /h rozwija się do /help, a /mod do /model."
  t206: "Przeciągnięcie ścieżki pliku do terminala automatycznie dołącza obrazy lub wysyła plik jako kontekst."
  t207: "Plik .worktreeinclude w katalogu głównym repozytorium wymienia pliki z gitignore, które mają być kopiowane do worktree."
  t208: "hermes acp uruchamia Hermes jako serwer ACP do integracji z VS Code, Zed i JetBrains."
  t209: "Własni dostawcy: zapisz nazwane punkty końcowe w config.yaml pod kluczem custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT wstrzykuje prompt systemowy, który nigdy nie jest zapisywany w historii."
  t211: "credential_pool_strategies obsługuje rotację fill_first, round_robin, least_used i random."
  t212: "hermes auth add nous lub hermes auth add openai-codex konfiguruje dostawców opartych na OAuth."
  t213: "Serwer API obsługuje zarówno Chat Completions, jak i Responses API ze stanem po stronie serwera."
  t214: "tool_preview_length: 0 w konfiguracji pokazuje pełne ścieżki plików w kanale aktywności spinnera."
  t215: "hermes status --deep uruchamia pogłębione kontrole diagnostyczne wszystkich komponentów."
  t216: "Zadania cron mogą dołączyć skrypt Pythona (--script), którego stdout jest wstrzykiwany do promptu jako kontekst."
  t217: "Skrypty cron znajdują się w ~/.hermes/scripts/ i działają przed agentem — idealne do potoków zbierania danych."
  t218: "prefill_messages_file w config.yaml wstrzykuje przykłady few-shot do każdego wywołania API, nigdy nie zapisując ich w historii."
  t219: "SOUL.md całkowicie zastępuje domyślną tożsamość agenta — przepisz go, aby Hermes stał się naprawdę Twój."
  t220: "SOUL.md jest przy pierwszym uruchomieniu automatycznie wypełniany domyślną osobowością. Edytuj go, aby ją dostosować."
  t221: "/compress <focus topic> przydziela 60–70% budżetu podsumowania Twojemu tematowi i agresywnie przycina resztę."
  t222: "Przy drugiej i kolejnych kompresjach kompresor aktualizuje poprzednie podsumowanie, zamiast zaczynać od zera."
  t223: "Przed resetem sesji gatewaya Hermes automatycznie zapisuje w tle ważne fakty do pamięci."
  t224: "network.force_ipv4: true w config.yaml naprawia zawieszenia na serwerach z uszkodzonym IPv6 — łata moduł socket."
  t225: "Narzędzie terminal opisuje typowe kody wyjścia: grep zwracający 1 = „Brak dopasowań (to nie błąd)”."
  t226: "Nieudane polecenia terminala na pierwszym planie są automatycznie powtarzane do 3 razy z wykładniczym odstępem (2 s, 4 s, 8 s)."
  t227: "Gołe polecenia sudo są automatycznie przepisywane tak, by przekazać SUDO_PASSWORD z .env — bez interaktywnego pytania o hasło."
  t228: "Pomocniki execute_code wymagają jawnych importów: from hermes_tools import json_parse, shell_quote, retry."
  t229: "7 narzędzi piaskownicy execute_code (web_search, terminal, read/write/search/patch) działa przez RPC — nigdy nie trafiają do kontekstu."
  t230: "Odczytanie tego samego fragmentu pliku 3+ razy wywołuje ostrzeżenie. Przy 4+ jest twardo blokowane, aby zapobiec pętlom."
  t231: "write_file i patch wykrywają, czy plik został zmodyfikowany z zewnątrz od ostatniego odczytu, i ostrzegają o nieaktualności."
  t232: "Format łatek V4A obsługuje dyrektywy Add File, Delete File i Move File — nie tylko Update."
  t233: "Serwery MCP mogą zażądać uzupełnień LLM zwrotnie przez sampling — agent staje się narzędziem dla serwera."
  t234: "Serwery MCP wysyłają notifications/tools/list_changed, aby wywołać automatyczną ponowną rejestrację narzędzi bez restartu."
  t235: "delegate_task z acp_command: 'claude' uruchamia Claude Code jako agenta potomnego z dowolnej platformy."
  t236: "Delegowanie ma wątek heartbeat — aktywność dziecka propaguje się do rodzica, zapobiegając przekroczeniom czasu gatewaya."
  t237: "Gdy dostawca zwraca HTTP 402 (wymagana płatność), klient pomocniczy automatycznie przechodzi do następnego."
  t238: "agent.tool_use_enforcement steruje modelami, które opisują działania zamiast wywoływać narzędzia — automatycznie dla GPT/Codex."
  t239: "agent.restart_after_turn_timeout pozwala trwającym turom dokończyć się, zanim /restart wejdzie w stop(); restart_drain_timeout to wyłącznie budżet na wymuszone przerwanie po rozpoczęciu stop()."
  t240: "agent.api_max_retries (domyślnie 3) określa, ile razy agent powtarza nieudane wywołanie API, zanim zgłosi błąd — obniż go, aby szybciej przechodzić na zapasowy model."
  t241: "Gateway buforuje instancje AIAgent per sesja — zniszczenie tego bufora psuje buforowanie promptów Anthropic."
  t242: "Każda strona może udostępniać umiejętności przez /.well-known/skills/index.json — Skills Hub wykrywa je automatycznie."
  t243: "Dziennik audytu umiejętności w ~/.hermes/skills/.hub/audit.log rejestruje każdą operację instalacji i usunięcia."
  t244: "Nieaktualne worktree gita są czyszczone automatycznie przy starcie: czyste, w pełni scalone drzewa są usuwane; zmiany niezatwierdzone lub niewypchnięte są zawsze zachowywane."
  t245: "Profile zakresują stan Hermes przez HERMES_HOME; podprocesy narzędzi hosta zachowują Twój prawdziwy HOME, chyba że terminal.home_mode ma wartość profile."
  t246: "Zmienna środowiskowa HERMES_HOME_MODE (ósemkowo, np. 0701) ustawia własne uprawnienia katalogu na potrzeby przechodzenia przez serwer WWW."
  t247: "Tryb kontenera: umieść .container-mode w HERMES_HOME, a CLI hosta automatycznie przełączy się do kontenera."
  t248: "Ctrl+C ma 5 poziomów priorytetu: anuluj nagrywanie → anuluj pytania → anuluj listę wyboru → przerwij agenta → wyjdź."
  t249: "Każde przerwanie podczas pracy agenta jest zapisywane w ~/.hermes/interrupt_debug.log ze znacznikami czasu."
  t250: "BROWSER_CDP_URL łączy narzędzia przeglądarki z dowolną działającą przeglądarką z rodziny Chromium — akceptuje WebSocket, HTTP lub host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true włącza zaawansowaną ochronę przed wykrywaniem z własnym Chromium (plan Scale)."
  t252: "CLI automatycznie przełącza się w tryb kompaktowy w terminalach węższych niż 80 kolumn."
  t253: "Szybkie polecenia mają dwa typy: exec (bezpośrednie uruchomienie polecenia powłoki) i alias (przekierowanie do innego polecenia)."
  t254: "Model delegowania per zadanie: delegation.model i delegation.provider w konfiguracji kierują podagentów do tańszych modeli."
  t255: "delegation.reasoning_effort niezależnie steruje głębokością myślenia podagentów."
  t256: "display.platforms w config.yaml pozwala nadpisywać ustawienia wyświetlania per platforma: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode w konfiguracji symuluje ludzkie tempo pisania — konfigurowalny zakres min_ms/max_ms."
  t258: "Migracje wersji konfiguracji uruchamiają się automatycznie przy wczytaniu — nowe klucze pojawiają się bez ręcznej ingerencji."
  t259: "Modele GPT i Codex otrzymują specjalne wskazówki w prompcie systemowym dotyczące dyscypliny i obowiązkowego użycia narzędzi."
  t260: "Modele Gemini otrzymują dopasowane dyrektywy dotyczące ścieżek bezwzględnych, równoległych wywołań narzędzi i poleceń nieinteraktywnych."
  t261: "context.engine w config.yaml można ustawić na nazwę wtyczki, aby użyć alternatywnej strategii zarządzania kontekstem."
  t262: "Migawki stron przeglądarki powyżej 15 000 znaków są przycinane lub automatycznie streszczane; pełna migawka trafia do cache/web do przeglądania przez read_file."
  t263: "Kompresor wykonuje tani wstępny przebieg: wyjścia narzędzi powyżej 200 znaków są zastępowane symbolami zastępczymi, zanim uruchomi się LLM."
  t264: "Gdy kompresja się nie powiedzie, kolejne próby są wstrzymywane na 10 minut, aby nie zasypywać API żądaniami."
  t265: "Długie niebezpieczne polecenia (>70 znaków) mają w pytaniu o zatwierdzenie opcję „view”, by najpierw zobaczyć pełny tekst."
  t266: "Wizualizacja poziomu dźwięku pokazuje podczas nagrywania głosu słupki ▁▂▃▄▅▆▇ na podstawie poziomów RMS mikrofonu."
  t267: "Nazwy profili nie mogą kolidować z istniejącymi programami w PATH — „hermes profile create ls” zostałoby odrzucone."
  t268: "hermes profile create backup --clone-all kopiuje wszystko (konfigurację, klucze, SOUL.md, pamięć, umiejętności, sesje)."
  t269: "Klawisz nagrywania głosu można zmienić przez voice.record_key w config.yaml — nie tylko Ctrl+B."
  t270: "Pliki .cursorrules i .cursor/rules/*.mdc są automatycznie wykrywane i wczytywane jako kontekst projektu."
  t271: "Pliki kontekstu są sprawdzane pod kątem 10+ wzorców wstrzykiwania promptów — niewidoczny Unicode, „ignoruj instrukcje”, próby eksfiltracji."
  t272: "GPT-5 i Codex używają w formacie wiadomości roli 'developer' zamiast 'system'."
  t273: "Nadpisania pomocnicze per zadanie: auxiliary.vision.provider, auxiliary.compression.model itd. w config.yaml."
  t274: "Klient pomocniczy traktuje 'main' jako alias dostawcy — rozwija się do Twojego faktycznego głównego dostawcy i modelu."
  t275: "hermes claw migrate --dry-run pokazuje podgląd migracji z OpenClaw bez zapisywania czegokolwiek."
  t276: "Ścieżki plików wklejone w cudzysłowach lub ze spacjami poprzedzonymi ukośnikiem są obsługiwane automatycznie — bez ręcznego czyszczenia."
  t277: "Polecenia z ukośnikiem nigdy nie uruchamiają zwijania dużych wklejeń — /command z dużymi argumentami działa poprawnie."
  t278: "W trybie przerywania polecenia z ukośnikiem wpisane podczas pracy agenta omijają logikę przerwania i wykonują się natychmiast."
  t279: "HERMES_DEV=1 omija wykrywanie trybu kontenera na potrzeby lokalnego rozwoju."
  t280: "Każdy serwer MCP dostaje własny zestaw narzędzi (mcp-servername), który można niezależnie włączać przez hermes tools."
  t281: "Symbole zastępcze MCP ${ENV_VAR} w konfiguracji są rozwiązywane przy uruchamianiu serwera — również zmienne z ~/.hermes/.env."
  t282: "Umiejętności z zaufanych repozytoriów (NousResearch) mają poziom bezpieczeństwa „trusted”; umiejętności społeczności są dodatkowo skanowane."
  t283: "Kwarantanna umiejętności w ~/.hermes/skills/.hub/quarantine/ przechowuje umiejętności oczekujące na przegląd bezpieczeństwa."
  t284: "/steer <prompt> wstrzykuje notatkę po następnym wywołaniu narzędzia — skoryguj kierunek w trakcie zadania bez przerywania."
  t285: "/goal <text> ustawia stały cel w pętli Ralpha — Hermes automatycznie kontynuuje turę po turze, aż sędzia uzna zadanie za wykonane."
  t286: "/snapshot create [label] zapisuje pełną migawkę stanu konfiguracji Hermes; /snapshot restore <id> pozwala później ją przywrócić."
  t287: "/copy [N] kopiuje do schowka ostatnią odpowiedź asystenta, a z liczbą — N-tą od końca."
  t288: "/redraw wymusza pełne przerysowanie interfejsu, naprawiając rozjechany terminal po zmianie rozmiaru w tmux lub artefaktach zaznaczania myszą."
  t289: "/agents (alias /tasks) pokazuje aktywnych agentów i działające zadania w tle w bieżącej sesji."
  t290: "/footer przełącza stopkę gatewaya w końcowych odpowiedziach, pokazującą model, % kontekstu i cwd."
  t291: "/busy queue|steer|interrupt określa, co robi naciśnięcie Enter, gdy Hermes pracuje."
  t292: "/topic w wiadomościach prywatnych Telegrama włącza tryb wielu sesji w tematach zarządzanych przez użytkownika — /topic <id> przywraca dawne sesje w miejscu."
  t293: "/approve session|always uruchamia oczekujące niebezpieczne polecenie z wybranym zakresem zaufania; /deny je odrzuca."
  t294: "/restart łagodnie restartuje gateway po dokończeniu aktywnych uruchomień, a po powrocie powiadamia osobę, która o to poprosiła."
  t295: "/kanban boards switch <slug> zmienia aktywną wieloprojektową tablicę Kanban bezpośrednio z czatu."
  t296: "/reload ponownie wczytuje ~/.hermes/.env do działającej sesji — podchwyć nowe klucze API bez restartu."
  t297: "cronjob z no_agent=True uruchamia skrypt według harmonogramu i wysyła jego stdout bezpośrednio — zero tokenów, zero LLM."
  t298: "Pusty stdout skryptu cron oznacza cichy tick — nic nie jest dostarczane, idealne dla strażników progów."
  t299: "HERMES_CRON_MAX_PARALLEL (domyślnie 4) ogranicza liczbę zadań cron uruchamianych w jednym ticku, by wyskoki nie zapchały Twoich kluczy."
  t300: "Hooki gatewaya znajdują się w ~/.hermes/hooks/<name>/ z HOOK.yaml + handler.py — handler musi nazywać się `handle`."
  t301: "Zdarzenia hooków obejmują gateway:startup, session:start, agent:step oraz subskrypcje wieloznaczne command:*."
  t302: "Umieść listę kontrolną w ~/.hermes/BOOT.md, a hook gateway:startup wykona ją jako jednorazowego agenta przy każdym uruchomieniu."
  t303: "hermes curator run --dry-run pokazuje, co kurator by zarchiwizował lub skonsolidował, bez wprowadzania jakichkolwiek zmian."
  t304: "hermes curator pin <skill> twardo chroni umiejętność zarówno przed automatyczną archiwizacją, jak i przed narzędziem skill_manage agenta."
  t305: "hermes curator rollback przywraca umiejętności z migawki sprzed uruchomienia — kopie zapasowe leżą w skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] czyści okresy karencji i flagi wyczerpania całej puli danych uwierzytelniających albo jednego wpisu wskazanego indeksem, id lub etykietą."
  t307: "credential_pool_strategies.<provider>: round_robin rotuje klucze równomiernie zamiast domyślnego fill_first."
  t308: "use_gateway: true per narzędzie kieruje web, image, tts lub browser przez Twoją subskrypcję Nous — bez dodatkowych kluczy."
  t309: "provider_routing.data_collection: deny wyklucza na OpenRouter dostawców przechowujących dane."
  t310: "provider_routing.require_parameters: true kieruje wyłącznie do dostawców obsługujących każdy parametr z Twojego żądania."
  t311: "HERMES_TUI_RESUME=1 automatycznie podłącza się przy starcie do ostatniej sesji TUI — przydatne po zerwaniu SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> wymusza motyw TUI w terminalach, które nie ustawiają COLORFGBG."
  t313: "Ctrl+G lub Ctrl+X Ctrl+E w TUI otwiera bufor wejścia w $EDITOR dla długich, wielowierszowych promptów."
  t314: "TUI renderuje LaTeX w tekście — $E=mc^2$ staje się matematycznym Unicode zamiast surowego TeX-a."
  t315: "hermes dashboard uruchamia lokalny interfejs WWW pod 127.0.0.1:9119 — żadne dane nie opuszczają localhost."
  t316: "hermes dashboard osadza pełne TUI Hermes w przeglądarce przez xterm.js i PTY po WebSocket."
  t317: "Umieść YAML z dwoma kolorami palety w ~/.hermes/dashboard-themes/, aby zmienić wygląd całego panelu."
  t318: "Wtyczki panelu są typu drop-in: manifest.json + paczka JS w ~/.hermes/dashboard-plugins/ — bez budowania przez npm."
  t319: "layoutVariant: cockpit w motywie panelu dodaje lewy pasek o szerokości 260 px, który wtyczki mogą wypełniać przez slot sidebar."
  t320: "display.tool_progress_command: true udostępnia /verbose na platformach komunikacyjnych; domyślnie działa tylko w CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result powiadamia tylko o zakończeniu zadań w tle (zamiast concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT ogranicza write_file/patch do wskazanych prefiksów katalogów; wiele ścieżek rozdziel os.pathsep (: lub ;)."
  t323: "HERMES_IGNORE_RULES pomija automatyczne wstrzykiwanie AGENTS.md, SOUL.md, .cursorrules, pamięci i wstępnie wczytanych umiejętności."
  t324: "HERMES_ACCEPT_HOOKS automatycznie zatwierdza nieznane hooki powłoki zadeklarowane w config.yaml bez pytania w TTY."
  t325: "auxiliary.goal_judge.model kieruje sędziego /goal do taniego, szybkiego modelu, by koszt pętli był bliski zeru."
  t326: "Punkty kontrolne pomijają katalogi z ponad 50 000 plików, aby uniknąć powolnych operacji gita w ogromnych monorepo."
  t327: "tts.provider: piper uruchamia lokalne TTS w 44 językach na CPU — głosy pobierają się automatycznie do ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command podłącza dowolny silnik TTS z CLI za pomocą symboli zastępczych {input_path} i {output_path}."
  t329: "API_SERVER_ENABLED=true uruchamia obok gatewaya punkt końcowy zgodny z OpenAI dla Open WebUI i LibreChat."
  t330: "GATEWAY_PROXY_URL uruchamia podzieloną konfigurację: obsługa platform lokalnie, praca agenta delegowana do zdalnego serwera API."
  t331: "MATRIX_DEVICE_ID przypina stały identyfikator urządzenia dla E2EE — bez niego klucze rotują przy każdym starcie i odszyfrowanie historii przestaje działać."
  t332: "TELEGRAM_WEBHOOK_SECRET jest wymagany zawsze, gdy ustawiono TELEGRAM_WEBHOOK_URL — wygeneruj go przez openssl rand -hex 32."
  t333: "batch_runner.py --resume dopasowuje ukończone prompty po treści, więc zmiana kolejności zbioru danych nie powtarza gotowej pracy."
  t334: "/new rozpoczyna świeżą sesję w miejscu (alias /reset) — nowy identyfikator sesji, czysta historia, CLI pozostaje otwarte."
  t335: "/clear czyści ekran terminala ORAZ rozpoczyna nową sesję — jeden skrót do wizualnego resetu."
  t336: "/history wypisuje bieżącą rozmowę w miejscu bez opuszczania CLI — przydatne do szybkiego ponownego przeczytania."
  t337: "/save zapisuje bieżącą rozmowę na dysk bez kończenia sesji."
  t338: "/status pokazuje w skrócie informacje o sesji: identyfikator, tytuł, model, zużycie tokenów i czas trwania."
  t339: "/image <path> dołącza lokalny plik obrazu do następnego promptu bez wklejania ani przeciągania."
  t340: "/platforms pokazuje stan połączenia gatewaya i platform komunikacyjnych bezpośrednio z czatu."
  t341: "/commands stronicuje pełną listę poleceń z ukośnikiem i zainstalowanych umiejętności — przydatne na platformach bez uzupełniania tabulatorem."
  t342: "/toolsets wypisuje każdy dostępny zestaw narzędzi, abyś wiedział, co akceptuje -t/--toolsets."
  t343: "/voice tts przełącza tryb tylko-TTS — agent odpowiada głosem, ale prompty nadal wpisujesz."
  t344: "/reload-skills ponownie skanuje ~/.hermes/skills/, więc dodane umiejętności pojawiają się bez restartu sesji."
  t345: "/indicator kaomoji|emoji|unicode|ascii wybiera styl wskaźnika zajętości TUI pokazywanego podczas pracy agenta."
  t346: "/debug przesyła pakiet diagnostyczny (informacje o systemie + logi) i zwraca linki do udostępnienia — działa też na czacie."
  t347: "hermes -z \"<prompt>\" to najczystszy tryb jednorazowy: na stdout trafia tylko końcowa odpowiedź — idealny do potoków w skryptach."
  t348: "hermes chat --pass-session-id wstrzykuje identyfikator sesji do promptu systemowego, aby agent mógł się do niego odwoływać."
  t349: "hermes chat --image path/to/pic.png dołącza lokalny obraz do pojedynczego zapytania -q bez osobnego kroku przesyłania."
  t350: "hermes chat --ignore-user-config pomija aktywną konfigurację użytkownika — odtwarzalne zgłoszenia błędów i uruchomienia w CI."
  t351: "hermes chat --source tool oznacza czaty programistyczne, aby nie zaśmiecały listy hermes sessions list."
  t352: "hermes dump --show-keys dołącza zredagowane odciski kluczy API na potrzeby głębszej diagnostyki wsparcia."
  t353: "hermes sessions rename <ID> \"new title\" zmienia nazwę dowolnej wcześniejszej sesji; hermes sessions delete <ID> ją usuwa."
  t354: "hermes import przywraca pełną kopię zapasową Hermes w formacie zip; eksporty sesji JSON/JSONL importuje się ze strony Sessions w panelu."
  t355: "hermes fallback zarządza interaktywnie łańcuchem fallback_model — bez ręcznej edycji config.yaml."
  t356: "hermes pairing rotuje token parowania DM — pierwsza osoba, która napisze po rotacji, uzyskuje dostęp do bota."
  t357: "hermes setup prowadzi nowych użytkowników przez wybór dostawcy, klucze i podłączenie platform w jednym interaktywnym przebiegu."
  t358: "hermes status --deep wykonuje pełny przegląd stanu każdego komponentu; samo hermes status to szybki podgląd."
  t359: "HERMES_AGENT_TIMEOUT=0 wyłącza ubijanie działającego agenta przez gateway z powodu bezczynności — przydatne przy długich badaniach."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 automatycznie wczytuje wtyczki repozytorium z ./.hermes/plugins/ — z założenia za bramką zaufania."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 wyłącza w patch i write_file zabezpieczenie „plik zmienił się od ostatniego odczytu”."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true pozwala narzędziom web łączyć się z localhost i sieciami prywatnymi — domyślnie wyłączone w trybie gatewaya."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 automatycznie instaluje dodatkowe umiejętności z katalogu opcjonalnego przy pierwszym uruchomieniu profilu."
  t364: "HERMES_BUNDLED_SKILLS wskazuje własne drzewo dołączonych umiejętności — używane przez pakiety Homebrew i Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 zrzuca każdy ładunek żądania API na stdout zamiast do plików logów."
  t366: "HERMES_OAUTH_TRACE=1 loguje zredagowane próby wymiany i odświeżania tokenów OAuth do diagnozowania uwierzytelniania dostawców."
  t367: "HERMES_STREAM_RETRIES (domyślnie 3) określa liczbę prób ponownego połączenia w trakcie strumienia przy przejściowych błędach sieci."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false wycisza komunikaty potwierdzenia ⚡/⏳/⏩, gdy użytkownik pisze do zajętego agenta."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (domyślnie 180s) określa, jak często gateway informuje o postępie podczas długich tur."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (domyślnie 900s) ogranicza, jak długo /restart czeka na trwające uruchomienia przed wymuszeniem."
  t371: "HERMES_CHECKPOINT_TIMEOUT (domyślnie 30s) ogranicza czas tworzenia punktu kontrolnego systemu plików — zwiększ go w ogromnych monorepo."
  t372: "image_gen.model w config.yaml wybiera model FAL: flux-2/klein, gpt-image-2, nano-banana-pro i inne."
  t373: "image_gen.provider kieruje generowanie obrazów przez wtyczkę (OpenAI Images, Codex, FAL) zamiast domyślnego dostawcy."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY kierują analizę obrazu do dowolnego punktu końcowego zgodnego z OpenAI."
  t375: "security.tirith_fail_open: false sprawia, że Hermes blokuje polecenia, gdy sam skaner tirith zgłosi błąd."
  t376: "Zmienna środowiskowa TIRITH_FAIL_OPEN nadpisuje ustawienie tirith_fail_open — szybki przełącznik bez edycji config.yaml."
  t377: "Czaty --source tool są domyślnie wykluczone z hermes sessions list — podaj --source jawnie, aby je zobaczyć."
  t378: "Identyfikatory sesji mają prefiks ze znacznikiem czasu (20250305_091523_abcd), więc sortowanie w ls i jq działa naturalnie."
  t379: "API_SERVER_MODEL_NAME dostosowuje nazwę modelu w /v1/models — niezbędne w wieloprofilowych konfiguracjach Open WebUI."
  t380: "Wtyczki panelu są serwowane z /dashboard-plugins/<name>/ — wystarczy umieścić pliki w ~/.hermes/dashboard-plugins/."
