    /whoami: Pokaż Twój poziom dostępu do poleceń z ukośnikiem (admin / użytkownik)
    /profile: Przełącz aktywny profil Hermes
    /codex-runtime: Przełącz środowisko codex app-server dla modeli OpenAI/Codex
    /personality: Ustaw predefiniowaną osobowość
    /battery: Przełącz kolorowy wskaźnik baterii na pasku stanu
    /timestamps: Przełącz znaczniki czasu [HH:MM] przy wiadomościach i w /history
    /diff: Pokaż zmiany git w katalogu roboczym
    /focus: Przełącz widok skupienia — pokazuj tylko Twój prompt i końcową odpowiedź
    /yolo: Przełącz YOLO — automatycznie zatwierdzaj niebezpieczne polecenia
    /approvals: Pokaż lub ustaw trwały tryb zatwierdzania niebezpiecznych poleceń
    /reasoning: Poziom lub wyświetlanie rozumowania [<poziom> [--global]|show|hide|full|clamp]
    /skin: Przełącz motyw aplikacji desktop lub przejdź do następnego
    /wake: Steruj nasłuchiwaniem słowa aktywującego w aplikacji desktop [on|off|status]
    /tools: 'Zarządzaj narzędziami: /tools [list|disable|enable] [nazwa...]'
    /memory: Przejrzyj oczekujące zapisy do pamięci / przełącz bramkę zatwierdzania
    /bundles: Wylistuj pakiety umiejętności (aliasy /<nazwa> dla wielu umiejętności)
    /pet: Przełącz lub adoptuj maskotkę z petdexu (/pet, /pet list, /pet boba)
    /hatch: Wygeneruj nowego zwierzaka (otwiera generator zwierzaków)
    /learn: Naucz się umiejętności wielokrotnego użytku z czegokolwiek, co opiszesz (katalogi, URL-e, ten czat, notatki)
    /init: Wygeneruj lub zaktualizuj instrukcje projektu AGENTS.md na podstawie skanu repozytorium
    /suggestions: Przejrzyj sugerowane automatyzacje (akceptuj/odrzuć)
    /blueprint: Skonfiguruj automatyzację z szablonu blueprint
    /browser: Zarządzaj połączeniem CDP przeglądarki [connect|disconnect|status] (tylko lokalny gateway)
    /palette: Otwórz paletę poleceń z wyszukiwaniem rozmytym (także Ctrl+P)
    /usage: Pokaż użycie tokenów i limity; `reset` wykorzystuje zachowany reset limitu Codex
    /subscription: Zobacz swój plan Nous i zmień go w przeglądarce
    /topup: Pokaż saldo Nous i zarządzaj płatnościami w portalu
    /platform: Wstrzymaj, wznów lub wylistuj platformę gateway z błędami
    /version: Pokaż wersję Hermes Agent
    /debug: Wyślij raport diagnostyczny (informacje o systemie + logi) i uzyskaj linki do udostępnienia
    /model: Przełącz model dla tej sesji
