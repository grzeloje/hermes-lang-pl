    codeExecution:
      mode: Jak ściśle wykonywanie kodu jest ograniczone do bieżącego projektu.
    fileReadMaxChars: Maksymalna liczba znaków, które Hermes może odczytać w jednym żądaniu pliku.
    approvals:
      mode: Jak Hermes obsługuje polecenia wymagające wyraźnego zatwierdzenia.
      timeout: Jak długo prośby o zatwierdzenie czekają, zanim upłynie ich limit czasu.
    security:
      redactSecrets: Ukrywaj wykryte sekrety w treści widocznej dla modelu, gdy to możliwe.
    checkpoints:
      enabled: Twórz migawki do przywracania przed edycją plików.
    memory:
      memoryEnabled: Zapisuj trwałe wspomnienia, które mogą pomóc w przyszłych sesjach.
      userProfileEnabled: Utrzymuj zwięzły profil preferencji użytkownika.
    context:
      engine: Strategia zarządzania długimi rozmowami w pobliżu limitu kontekstu.
    compression:
      enabled: Streszczaj starszy kontekst, gdy rozmowy stają się duże.
      codexGpt55Autoraise: Podnoś kompresję do 85% dla obsługiwanych modeli ChatGPT Codex OAuth.
    auxiliary:
      compression:
        timeout: Liczba sekund oczekiwania na pomocniczy model kompresji na jedno wywołanie (domyślnie 120). Zwiększ dla wolnych modeli lokalnych.
    voice:
      autoTts: Automatycznie odczytuj odpowiedzi asystenta.
      voiceChatMode: 'chained: mowa na tekst → Hermes → tekst na mowę z dostawcami poniżej. gpt-live: jeden pełnodupleksowy model głosowy OpenAI (gpt-live-1) słucha i mówi, a każde prawdziwe żądanie przekazuje do Hermesa — odpowiada wybrany przez Ciebie model z pełnym zestawem narzędzi. Wymaga klucza API OpenAI; warstwa głosowa kosztuje 0,05 USD za minutę.'
      gptLive:
        voice: Głos dla trybu GPT-Live. Akceptowane są własne identyfikatory głosów.
        instructions: Dodatkowe zdania dla persony głosowej na żywo (ton, tempo, język). Hermes zachowuje własny prompt systemowy.
    tts:
      xai:
        voiceId: Identyfikator głosu xAI (np. eve) lub własny identyfikator głosu.
        language: Kod języka mowy (np. en, pt-BR) lub "auto" dla automatycznego wykrywania.
        speed: Szybkość odtwarzania. 0.7 = wolniej, 1.0 = normalnie, 1.5 = szybciej.
        autoSpeechTags: Pozwól LLM wstawiać ekspresyjne tagi audio ([laughing], [sighs]) do tekstu przed syntezą.
        optimizeStreamingLatency: Kompromis między opóźnieniem a jakością. 0 = najlepsza jakość, 2 = najniższe opóźnienie.
        sampleRate: Częstotliwość próbkowania dźwięku w Hz. Wyższa = lepsza jakość, większe pliki.
        bitRate: Przepływność MP3 w b/s. Dotyczy tylko kodeka mp3.
      neutts:
        device: Lokalne urządzenie inferencji dla NeuTTS.
    stt:
      enabled: Włącz lokalną lub dostarczaną przez dostawcę transkrypcję mowy.
      echoTranscripts: Publikuj surową transkrypcję 🎙️ wiadomości głosowych z powrotem na czacie.
      elevenlabs:
        languageCode: Opcjonalny kod języka ISO-639-3. Puste pozwala ElevenLabs wykryć język automatycznie.
