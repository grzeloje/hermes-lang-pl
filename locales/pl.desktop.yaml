      auth: Usługa AI odrzuciła Twoje logowanie. Sprawdź dane uwierzytelniające tego dostawcy, a potem wyślij wiadomość ponownie.
      billing: Na Twoim koncie nie ma już środków u tego dostawcy. Doładuj konto lub zmień dostawcę, a potem wyślij ponownie.
      disk: Twój dysk jest pełny, więc Hermes nie mógł zapisać tej rozmowy. Zwolnij trochę miejsca, a potem spróbuj ponownie.
      endpoint: Hermes nie może połączyć się z Twoim własnym serwerem modelu. Sprawdź, czy działa, a potem wyślij wiadomość ponownie.
      gateway: Hermes napotkał wewnętrzny problem podczas rozpoczynania tej odpowiedzi. Wyślij wiadomość ponownie; jeśli problem się powtarza, wyślij diagnostykę.
      generic: Coś poszło nie tak, gdy Hermes odpowiadał. Spróbuj ponownie lub skopiuj szczegóły, jeśli problem się powtarza.
      provider: Usługa AI nie mogła zrealizować tego żądania. Spróbuj ponownie za chwilę lub zmień dostawcę.
      runtime: Hermes napotkał wewnętrzny problem podczas rozpoczynania tej odpowiedzi. Wyślij wiadomość ponownie; jeśli problem się powtarza, wyślij diagnostykę.
      streaming: Połączenie zostało przerwane, zanim odpowiedź się zakończyła. Spróbuj ponownie, aby wysłać ją jeszcze raz.
    errorCodes:
      auth:
        title: '{0} odrzucił Twoje logowanie'
        body: Dane uwierzytelniające zapisane dla {0} nie zostały zaakceptowane. Popraw je w Ustawieniach lub zmień dostawcę, a potem wyślij wiadomość ponownie.
      auth_permanent:
        title: '{0} odrzucił Twoje logowanie'
        body: Dane uwierzytelniające zapisane dla {0} są nieprawidłowe lub zostały unieważnione. Zaktualizuj je lub zmień dostawcę, a potem wyślij wiadomość ponownie.
      billing:
        title: Brak środków
        body: Na Twoim koncie {0} nie ma już środków. Doładuj konto lub zmień dostawcę, a potem wyślij ponownie.
      rate_limit:
        title: Usługa AI jest zajęta
        body: '{0} ogranicza teraz liczbę żądań. Odczekaj minutę, a potem spróbuj ponownie.'
      upstream_rate_limit:
        title: Usługa AI jest zajęta
        body: '{0} ogranicza teraz liczbę żądań. Odczekaj minutę, a potem spróbuj ponownie.'
      overloaded:
        title: Usługa AI jest przeciążona
        body: '{0} ma teraz problemy. Spróbuj ponownie za chwilę lub zmień dostawcę.'
      server_error:
        title: Usługa AI miała problem
        body: '{0} zwrócił błąd serwera. Spróbuj ponownie za chwilę lub zmień dostawcę.'
      timeout:
        title: Nie można połączyć się z usługą AI
        body: Nie udało się połączyć z {0} lub nie odpowiedział na czas. Sprawdź połączenie z internetem, a potem spróbuj ponownie.
      stream_drop:
        title: Odpowiedź została przerwana
        body: Połączenie zostało przerwane, zanim odpowiedź się zakończyła. Spróbuj ponownie, aby wysłać ją jeszcze raz.
      upstream_blocked:
        title: Zapora zablokowała żądanie
        body: Zapora lub CDN przed {0} zablokowała żądanie, zanim dotarło do modelu — Twój klucz jest prawdopodobnie w porządku. Ustaw nagłówek User-Agent w extra_headers dostawcy w Ustawieniach lub zmień dostawcę, a potem wyślij wiadomość ponownie.
      ssl_cert_verification:
        title: Bezpieczne połączenie nie powiodło się
        body: Hermes nie mógł zweryfikować bezpiecznego połączenia z {0}. Sprawdź ustawienia sieci lub proxy albo zmień dostawcę, a potem wyślij wiadomość ponownie.
      context_overflow:
        title: Ta rozmowa jest zbyt długa
        body: Rozmowa nie mieści się już w modelu. Skompresuj ją lub rozpocznij nowy czat, a potem wyślij ponownie.
      payload_too_large:
        title: Ta wiadomość jest zbyt duża
        body: Żądanie było zbyt duże dla modelu. Skompresuj rozmowę lub rozpocznij nowy czat, a potem wyślij ponownie.
      model_not_found:
        title: Ten model jest niedostępny
        body: '{0} nie oferuje tego modelu na Twoim koncie. Wybierz inny model, a potem wyślij wiadomość ponownie.'
      provider_policy_blocked:
        title: Ten model jest zablokowany przez ustawienia Twojego konta
        body: '{0} nie przekierował tego żądania ze względu na ustawienia danych lub prywatności Twojego konta. Wybierz inny model lub zmień dostawcę.'
      content_policy_blocked:
        title: Usługa AI odmówiła realizacji tego żądania
        body: '{0} nie odpowiedział na tę wiadomość. Zmień ją i wyślij ponownie.'
      format_error:
        title: Usługa AI odrzuciła żądanie
        body: '{0} nie zaakceptował sposobu zbudowania tego żądania. Zmień dostawcę lub wyślij diagnostykę, abyśmy mogli to sprawdzić.'
      truncated:
        title: Odpowiedź została ucięta
        body: Model zatrzymał się przed zakończeniem. Spróbuj ponownie, aby uzyskać pełną odpowiedź.
      invalid_response:
        title: Usługa AI wysłała nieczytelną odpowiedź
        body: '{0} zwrócił coś, czego Hermes nie mógł odczytać. Spróbuj ponownie za chwilę.'
      empty_response:
        title: Usługa AI wysłała pustą odpowiedź
        body: '{0} nie zwrócił nic dla tej wiadomości. Spróbuj ponownie za chwilę.'
