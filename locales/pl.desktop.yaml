    timezone: Identyfikator strefy czasowej IANA. Puste = strefa czasowa systemu.
    browser:
      useRealProfile: Lokalne przeglądanie korzysta z Twoich prawdziwych logowań. Hermes kopiuje profil domyślnej przeglądarki (ciasteczka, logowania, preferencje) do zarządzanej migawki i steruje nią za pomocą dołączonego Chromium — Twój aktywny profil nigdy nie jest otwierany bezpośrednio, a kopia jest odświeżana z niego przy każdym uruchomieniu. Pozwala też agentowi na żądanie otworzyć lokalną sesję z prawdziwym profilem, nawet gdy skonfigurowano backend przeglądarki w chmurze. Obsługiwane są tylko przeglądarki oparte na Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); inna domyślna przeglądarka kończy się czytelnym komunikatem o błędzie. Domyślnie wyłączone.
    agent:
      imageInputMode: Określa, jak załączniki graficzne są wysyłane do modelu.
      maxTurns: Górny limit tur z wywołaniami narzędzi, po którym Hermes przerywa przebieg.
    terminal:
      cwd: Domyślny folder projektu dla pracy narzędzi i terminala.
      persistentShell: Zachowuj stan powłoki między poleceniami, gdy backend to obsługuje.
      envPassthrough: Zmienne środowiskowe przekazywane do wykonywania narzędzi.
      dockerImage: Obraz kontenera używany, gdy backendem wykonywania jest Docker.
