userMessages.promptTimeout.vaultCode: "Zamknięto monit o kod weryfikacyjny: brak odpowiedzi w wyznaczonym czasie, więc logowanie zostało pominięte. Wyślij prośbę ponownie, gdy będziesz mieć kod."
userMessages.promptTimeout.vaultSaveLogin: "Zamknięto monit o zapisanie danych logowania: brak odpowiedzi w wyznaczonym czasie, więc nic nie zapisano. Wyślij prośbę ponownie, gdy będziesz gotowy."
userMessages.promptTimeout.vaultUnlockPrompt: "Zamknięto monit o odblokowanie: brak odpowiedzi w wyznaczonym czasie, więc menedżer haseł pozostał zablokowany. Wyślij prośbę ponownie, gdy będziesz gotowy go odblokować."
userMessages.rpc.notConnected: "Hermes nie jest teraz połączony, więc nie wysłano tej wiadomości. Połączenie zostanie przywrócone automatycznie; odczekaj chwilę i spróbuj ponownie lub wpisz /logs, jeśli problem się powtarza."
userMessages.rpc.sessionNotFound: "Ten czat nie jest już powiązany z backendem (był bezczynny lub backend został uruchomiony ponownie). Historia jest zapisana: wpisz /resume, aby go otworzyć."
userMessages.rpc.slashCrashed: "/{0} nie zakończyło się: pomocnik polecenia uległ awarii. Spróbuj ponownie; wpisz /logs, aby zobaczyć ślad błędu."
userMessages.rpc.slashTimedOut: "/{0} nie zakończyło się: pomocnik polecenia przekroczył limit czasu. Spróbuj ponownie; jeśli problem się powtarza, wpisz /logs i zgłoś ostatnie linie."
userMessages.rpc.timedOut: "Hermes nie odpowiedział w ciągu {0} s. Spróbuj ponownie; jeśli problem się powtarza, wpisz /logs i zgłoś ostatnie linie."
userMessages.rpc.versionSkew: "Interfejs terminala i backend Hermes są niezsynchronizowane (różne wersje). Uruchom /update albo wyjdź i uruchom `hermes update`, a potem ponownie włącz TUI."
userMessages.skills.noneInstalled: "Nie zainstalowano jeszcze żadnych umiejętności. Wpisz /skills browse, aby przejrzeć katalog, lub /skills install <name>."
